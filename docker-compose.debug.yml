# Local Jellyfin 12.2 harness for the Original Titles plugin.
#
#   docker compose -f docker-compose.debug.yml watch      # start + hot-reload (README: "Local harness")
#   docker compose -f docker-compose.debug.yml down -v    # stop and wipe all harness state
#
# Image: the official jellyfin/jellyfin 12.2 line (reports Jellyfin.Server 12.2.0.0).
# linuxserver has no extra value here: this is a throwaway test server.
#
# The official image runs as root with JELLYFIN_DATA_DIR=/config; JELLYFIN_DATA_DIR is moved to /config/data
# below so the manual-plugin path is /config/data/plugins/<Name>_<version>/, identical to a linuxserver/jellyfin install.
#
# Why a staging dir: Jellyfin must never have its plugin DLL overwritten in place while running (a copy during
# shutdown corrupts the loaded assembly). `docker compose watch` therefore syncs the build output into
# /plugin-staging (never read by Jellyfin) and restarts the container; the entrypoint then copies staging ->
# plugin dir BEFORE Jellyfin starts. Jellyfin cannot hot-load/replace a plugin, so every change = restart.
#
# Build the plugin first (`dotnet build`, or leave `dotnet watch build` running, see README). No metadata
# providers are enabled by seed.ps1 and no real library server is contacted.
name: jf-original-titles

services:
  jellyfin:
    image: jellyfin/jellyfin:12.2
    container_name: jf-original-titles-harness
    environment:
      TZ: Etc/UTC
      JELLYFIN_DATA_DIR: /config/data
      PLUGIN_DIR: Original Titles_0.1.0.0   # must equal <Name>_<version> and the version in scripts/harness/meta.json
    entrypoint:
      - /bin/sh
      - -c
      - |
        # First start: `watch` fills /plugin-staging (initial_sync) AFTER the container is up and does not restart it,
        # so wait for the synced files here. A plain `up` (no watch) never fills it: start without the plugin.
        i=0
        while [ $$i -lt 40 ] && { [ ! -f /plugin-staging/meta.json ] || [ ! -f /plugin-staging/Jellyfin.Plugin.OriginalTitles.dll ]; }; do
          i=$$((i+1)); sleep 1
        done
        sleep 2
        d="/config/data/plugins/$$PLUGIN_DIR"
        rm -rf "$$d"
        mkdir -p "$$d"
        cp -r /plugin-staging/. "$$d"/ 2>/dev/null || echo "WARNING: /plugin-staging is empty, starting without the plugin"
        exec /jellyfin/jellyfin
    ports:
      - "127.0.0.1:18096:8096"   # clash-free; bound to loopback only
    volumes:
      - jf-config:/config
      - jf-cache:/cache
      - ./scripts/harness/media:/media:ro   # generated by seed.ps1, gitignored
    restart: "no"
    develop:
      watch:
        # Plugin build output (dll, pdb, deps.json). Anything in here ends up next to the plugin dll.
        - action: sync+restart
          path: ./Jellyfin.Plugin.OriginalTitles/bin/Debug/net10.0
          target: /plugin-staging
          ignore:
            - "*.xml"
          initial_sync: true
        - action: sync+restart
          path: ./scripts/harness/meta.json
          target: /plugin-staging/meta.json
          initial_sync: true

volumes:
  jf-config:
  jf-cache:
